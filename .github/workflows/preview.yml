name: Preview renders

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t efficio .
      - name: Render drivetrain with the efficio CLI
        run: |
          mkdir -p previews
          docker run -v ${{ github.workspace }}:/app efficio \
            poetry run python -m efficio --object RearTransaxle \
            --params crank_angle=30 --png /app/previews/rear_transaxle.png
      - uses: actions/upload-artifact@v4
        with:
          name: previews
          path: previews/*.png
